name: ci-terraform

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/ci-terraform.yml"

permissions:
  contents: read

concurrency:
  group: ci-terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra

      - name: terraform validate
        run: |
          # foundation and serverless must exist; access is optional.
          for stack in foundation serverless access; do
            if [ "$stack" = "access" ] && ! ls infra/access/*.tf >/dev/null 2>&1; then
              echo "::notice::infra/access has no .tf files, skipping"
              continue
            fi
            echo "::group::validate $stack"
            terraform -chdir=infra/$stack init -backend=false -input=false
            terraform -chdir=infra/$stack validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@v4

      - name: tflint
        run: tflint --recursive --chdir=infra --format compact

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: checkov
        run: |
          pip install --quiet "checkov>=3,<4"
          checkov --directory infra --framework terraform --quiet --compact

  plan:
    needs: validate
    # Fork PRs get no OIDC token, so no plan there.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prd]
        stack: [foundation, serverless]
    env:
      ENV: ${{ matrix.env }}
      STACK: ${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4

      # A stack without .tf files has nothing to plan yet (same rule as deploy-env).
      - name: Detect stack
        id: stack
        run: |
          if ls "infra/$STACK"/*.tf >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::infra/$STACK has no .tf files, skipping"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.stack.outputs.found == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # Read-only service account, not bound to a GitHub Environment so a PR
      # plan never waits for the prd reviewers. Without an Environment the
      # per-env values are repository variables suffixed _DEV / _PRD
      # (written by scripts/bootstrap-wif.sh).
      - if: steps.stack.outputs.found == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars[format('GCP_WORKLOAD_IDENTITY_PROVIDER_{0}', matrix.env)] }}
          service_account: ${{ vars[format('GCP_PLAN_SERVICE_ACCOUNT_{0}', matrix.env)] }}

      - name: terraform init
        if: steps.stack.outputs.found == 'true'
        run: |
          terraform -chdir="infra/$STACK" init -input=false \
            -backend-config="bucket=${{ vars[format('TF_STATE_BUCKET_{0}', matrix.env)] }}" \
            -backend-config="prefix=$STACK"

      - name: terraform plan
        if: steps.stack.outputs.found == 'true'
        run: |
          terraform -chdir="infra/$STACK" plan -input=false -lock=false \
            -var-file="$ENV.tfvars" -out="$RUNNER_TEMP/tfplan"
          terraform -chdir="infra/$STACK" show -no-color "$RUNNER_TEMP/tfplan" > "$RUNNER_TEMP/plan.txt"

      - if: always() && steps.stack.outputs.found == 'true'
        name: Comment the plan on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const file = `${process.env.RUNNER_TEMP}/plan.txt`;
            const marker = `<!-- tfplan:${process.env.ENV}:${process.env.STACK} -->`;
            let plan = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : 'The plan failed, see the job logs.';
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... truncated, see the job logs';
            const body = `${marker}\n### Terraform plan: \`${process.env.ENV}\` / \`${process.env.STACK}\`\n\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n\n</details>`;
            // Paginate: past 100 comments the plan would otherwise be duplicated.
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find((c) => (c.body || '').startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
