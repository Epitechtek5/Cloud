name: deploy

# dev is deployed from the dev branch, prd from the release tags. A tag never
# redeploys dev: it holds main's code, which is behind dev.
on:
  push:
    branches: [dev]
    tags: ["v*"]
    # Docs-only pushes (e.g. the architecture diagram PR) do not redeploy dev.
    # GitHub never evaluates path filters for tag pushes.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  # Manual run: redeploys dev from the dev branch, or prd from a v* tag (still
  # behind the prd reviewers). With runner=github-hosted it is also the way to
  # recreate dev, and its runners, while their cluster does not exist.
  workflow_dispatch:
    inputs:
      runner:
        description: "Runners: self-hosted (CI_RUNNER_TRUSTED) or github-hosted (ubuntu-latest, e.g. while the runners cluster is down)"
        type: choice
        options: [self-hosted, github-hosted]
        default: self-hosted

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner == 'github-hosted' && 'ubuntu-latest' || vars.CI_RUNNER_TRUSTED }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build functions
        working-directory: app/functions
        run: |
          npm ci
          npm run build
          # The self-hosted runner image has no zip binary (GitHub-hosted has).
          if ! command -v zip >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends zip
          fi
          mkdir -p "$RUNNER_TEMP/artifact"
          (cd dist && zip -qr "$RUNNER_TEMP/artifact/functions.zip" .)

      - name: Build frontend
        working-directory: app/frontend
        run: |
          npm ci
          npm run build
          cp -r dist "$RUNNER_TEMP/artifact/frontend"

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.sha }}
          path: ${{ runner.temp }}/artifact
          if-no-files-found: error

  deploy-dev:
    needs: build
    if: github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/deploy-env.yml
    with:
      env: dev
      artifact: app-${{ github.sha }}
    permissions:
      contents: read
      id-token: write

  # Gated by the required reviewers of the prd GitHub Environment.
  deploy-prd:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/deploy-env.yml
    with:
      env: prd
      artifact: app-${{ github.sha }}
    permissions:
      contents: read
      id-token: write

  # Calls the reusable workflow added with the architecture diagram issue (#11).
  # Nothing depends on this job, so a failure never affects the deployments.
  architecture:
    needs: deploy-prd
    uses: ./.github/workflows/architecture.yml
    with:
      runner: ${{ inputs.runner || 'self-hosted' }}
    # publish reads repository secrets (GitHub App); a reusable workflow only
    # receives them when they are passed explicitly.
    secrets: inherit
    permissions:
      contents: read
      id-token: write
