name: ci-security

# No path filter: secrets can land anywhere in the repository.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-security-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.21.2

jobs:
  gitleaks:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Official binary, checksum verified. gitleaks-action is avoided on
      # purpose: it needs a license for organization accounts.
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "$base/$archive"
          curl -fsSL -o "$RUNNER_TEMP/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && sha256sum --ignore-missing -c checksums.txt)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          sudo install "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks

      - name: Scan the PR commit range
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gitleaks git --config .gitleaks.toml --redact --verbose --no-banner \
            --log-opts="${BASE_SHA}..${HEAD_SHA}"

      - name: Scan the full history
        if: github.event_name == 'push'
        run: gitleaks git --config .gitleaks.toml --redact --verbose --no-banner

  semgrep:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    # Non-blocking until the first findings are triaged.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Semgrep
        run: |
          pip install --quiet semgrep
          paths=""
          for p in app/functions app/frontend; do [ -d "$p" ] && paths="$paths $p"; done
          semgrep scan --error --metrics=off \
            --config p/javascript --config p/typescript --config p/nodejs $paths
