name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (no tag, no release), on the selected branch
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      # A tag pushed with the default GITHUB_TOKEN does not trigger deploy.yml,
      # so the release runs as a dedicated GitHub App.
      - id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npx --yes semantic-release@24 --dry-run --no-ci --branches "$BRANCH"
          else
            npx --yes semantic-release@24
          fi
