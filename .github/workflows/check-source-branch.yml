name: Check source branch

on:
  pull_request:
    branches: [main]

concurrency:
  group: check-source-branch-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  only-dev:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Ensure PR comes from dev
        if: github.head_ref != 'dev'
        run: |
          echo "::error::Only 'dev' can be merged into 'main' (got '${{ github.head_ref }}')."
          exit 1
