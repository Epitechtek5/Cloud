name: destroy

on:
  workflow_dispatch:
    inputs:
      env:
        description: Environment to destroy
        type: choice
        options: [dev, prd]
        required: true
      confirm:
        description: "Type destroy-<env> to confirm (for example destroy-prd)"
        type: string
        required: true

permissions:
  contents: read

jobs:
  guard:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Check the confirmation
        env:
          ENV: ${{ inputs.env }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "destroy-$ENV" ]; then
            echo "::error::Confirmation mismatch: expected 'destroy-$ENV'"
            exit 1
          fi

  destroy:
    needs: guard
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    # Required reviewers for prd are configured on the GitHub Environment.
    environment: ${{ inputs.env }}
    # Shares the group with deploy-env so a destroy never overlaps a deploy.
    concurrency:
      group: deploy-${{ inputs.env }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ENV: ${{ inputs.env }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # Reverse order of the deploy. infra/access (human access) is never
      # listed here, on purpose.
      - name: terraform destroy (serverless, then foundation)
        env:
          TF_VAR_app_artifact_dir: ${{ runner.temp }}/empty
        run: |
          mkdir -p "$TF_VAR_app_artifact_dir"
          for stack in serverless foundation; do
            if ! ls infra/$stack/*.tf >/dev/null 2>&1; then
              echo "::notice::infra/$stack has no .tf files, skipping"
              continue
            fi
            echo "::group::destroy $stack ($ENV)"
            terraform -chdir=infra/$stack init -input=false \
              -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
              -backend-config="prefix=$stack"
            terraform -chdir=infra/$stack destroy -input=false -auto-approve \
              -var-file="$ENV.tfvars"
            echo "::endgroup::"
          done
