name: destroy

on:
  workflow_dispatch:
    inputs:
      env:
        description: Environment to destroy
        type: choice
        options: [dev, prd]
        required: true
      confirm:
        description: "Type destroy-<env> to confirm (for example destroy-prd)"
        type: string
        required: true

permissions:
  contents: read

jobs:
  guard:
    # Never on the runners: this Terraform creates and destroys their cluster.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the confirmation
        env:
          ENV: ${{ inputs.env }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "destroy-$ENV" ]; then
            echo "::error::Confirmation mismatch: expected 'destroy-$ENV'"
            exit 1
          fi

  destroy:
    needs: guard
    # Never on the runners: this Terraform creates and destroys their cluster.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required reviewers for prd are configured on the GitHub Environment.
    environment: ${{ inputs.env }}
    # Shares the group with deploy-env so a destroy never overlaps a deploy.
    concurrency:
      group: deploy-${{ inputs.env }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ENV: ${{ inputs.env }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # Reverse order of the deploy. infra/access (human access) and
      # infra/billing (budget alerts) are never listed here, on purpose.
      - name: terraform destroy (serverless, then foundation)
        env:
          TF_VAR_app_artifact_dir: ${{ runner.temp }}/empty
        run: |
          mkdir -p "$TF_VAR_app_artifact_dir"
          for stack in serverless foundation; do
            if ! ls infra/$stack/*.tf >/dev/null 2>&1; then
              echo "::notice::infra/$stack has no .tf files, skipping"
              continue
            fi
            echo "::group::destroy $stack ($ENV)"
            terraform -chdir=infra/$stack init -input=false \
              -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
              -backend-config="prefix=$stack"
            terraform -chdir=infra/$stack destroy -input=false -auto-approve \
              -var-file="$ENV.tfvars"
            echo "::endgroup::"
          done

      # Cloud Functions (2nd gen) creates its own source buckets
      # (gcf-v2-sources-<number>-<region>, gcf-v2-uploads-<number>.<region>...)
      # outside Terraform: the destroy above leaves them behind (issue #56).
      - name: Remove the buckets Cloud Functions created outside Terraform
        run: |
          set -euo pipefail
          project="${GOOGLE_CLOUD_PROJECT:?}"
          number="$(gcloud projects describe "$project" --format='value(projectNumber)')"
          gcloud storage buckets list --project "$project" --format='value(name)' \
            | { grep -E "^gcf-v2-(sources|uploads)-${number}[-.]" || true; } \
            | while read -r bucket; do
                echo "Removing gs://$bucket"
                gcloud storage rm --recursive "gs://$bucket"
              done

      # Proof for the defense: only the state bucket and infra/access are left.
      # Fails the run if anything else is still there.
      - name: Check that nothing billable is left
        run: scripts/check-leftovers.sh "${GOOGLE_CLOUD_PROJECT:?}"
