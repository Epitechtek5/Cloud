name: deploy-env

# Reusable: applies the infrastructure and the app artifact to one environment.
on:
  workflow_call:
    inputs:
      env:
        description: Target environment (dev or prd)
        type: string
        required: true
      artifact:
        description: Name of the build artifact to deploy
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: deploy-${{ inputs.env }}
    # Never on the runners: this Terraform creates and destroys their cluster.
    runs-on: ubuntu-latest
    # The first apply of an environment creates everything, the API Gateway alone
    # takes about 10 minutes. A job cancelled mid-apply can leave the state lock.
    timeout-minutes: 60
    # Required reviewers on prd are configured on the GitHub Environment.
    environment: ${{ inputs.env }}
    concurrency:
      group: deploy-${{ inputs.env }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ENV: ${{ inputs.env }}
    steps:
      - uses: actions/checkout@v4

      # Same artifact for every environment: nothing is rebuilt here.
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/artifact

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # GCP_SERVICE_ACCOUNT is a variable of the GitHub Environment; the trust
      # policy only accepts the matching `environment:<env>` subject claim.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: terraform apply (foundation, then serverless)
        env:
          TF_VAR_app_artifact_dir: ${{ runner.temp }}/artifact
        run: |
          for stack in foundation serverless; do
            if ! ls infra/$stack/*.tf >/dev/null 2>&1; then
              echo "::notice::infra/$stack has no .tf files, skipping"
              continue
            fi
            echo "::group::apply $stack ($ENV)"
            terraform -chdir=infra/$stack init -input=false \
              -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
              -backend-config="prefix=$stack"
            terraform -chdir=infra/$stack apply -input=false -auto-approve \
              -var-file="$ENV.tfvars"
            echo "::endgroup::"
          done

      # Slash commands of the environment's Discord application (issue #63).
      # The bot token is read from Secret Manager with the OIDC identity of the
      # environment: it is never stored in GitHub, and masked in case anything
      # echoes it. Skipped until the environment variables DISCORD_APPLICATION_ID
      # (and DISCORD_GUILD_ID for guild commands) are set on the GitHub Environment.
      - name: Register the Discord slash commands
        if: vars.DISCORD_APPLICATION_ID != ''
        working-directory: app/functions
        env:
          APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
          GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
        run: |
          set -euo pipefail
          token="$(gcloud secrets versions access latest --secret=discord-bot-token --project="${GOOGLE_CLOUD_PROJECT:?}")"
          echo "::add-mask::$token"
          DISCORD_BOT_TOKEN="$token" node commands/register.js \
            --application-id "$APPLICATION_ID" ${GUILD_ID:+--guild-id "$GUILD_ID"}

      # Contract: the serverless stack exposes an `app_url` output. Skipped
      # while infra/serverless has no .tf files (same rule as the apply loop).
      - name: Smoke tests
        run: |
          if ! ls infra/serverless/*.tf >/dev/null 2>&1; then
            echo "::notice::infra/serverless has no .tf files, no smoke test"
            exit 0
          fi
          url=$(terraform -chdir=infra/serverless output -raw app_url)
          echo "Checking $url"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 5 --retry-all-errors "$url" > /dev/null

          # The gateway end to end: gateway -> ID token of its service account
          # -> private function. A new config can take a moment to be served.
          gateway=$(terraform -chdir=infra/serverless output -raw gateway_url)
          echo "Checking $gateway/health"
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 6 --retry-all-errors "$gateway/health" > /dev/null
