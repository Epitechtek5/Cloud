name: ci-functions

on:
  pull_request:
    paths:
      - "app/functions/**"
      - ".github/workflows/ci-functions.yml"

permissions:
  contents: read

concurrency:
  group: ci-functions-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app/functions

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/functions/package-lock.json

      # The Firestore emulator (tests of the workers) is a Java program.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The emulator jar is downloaded by firebase-tools on first use.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-functions-${{ hashFiles('app/functions/package.json') }}

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Unit tests and the Firestore tests (test/emulator) under the emulator,
      # with coverage of src; the run fails below the thresholds set in
      # package.json (test:coverage).
      - name: Tests and coverage (Firestore emulator)
        run: npm run test:ci

      - name: Build
        run: npm run build

      # The self-hosted runner has no zip binary: jar (from the JDK installed
      # above for the emulator) writes a standard zip archive.
      - name: Package
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          jar --create --no-manifest --file "$RUNNER_TEMP/package/functions.zip" -C dist .

      # Kept for inspection only: PRs never deploy.
      - uses: actions/upload-artifact@v4
        with:
          name: functions-package
          path: ${{ runner.temp }}/package/functions.zip
          retention-days: 7

  audit:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm audit (production dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high
