apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-secret-manager
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    gcpsm:
      projectID: {{ required "store.projectID is required" .Values.store.projectID | quote }}
      auth:
        workloadIdentity:
          clusterProjectID: {{ .Values.store.projectID | quote }}
          clusterName: {{ required "store.cluster.name is required" .Values.store.cluster.name | quote }}
          clusterLocation: {{ required "store.cluster.location is required" .Values.store.cluster.location | quote }}
          serviceAccountRef:
            name: {{ .Values.store.serviceAccount | quote }}
