{{- if not .Values.keys }}
{{- fail "keys is required" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretName }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    kind: SecretStore
    name: gcp-secret-manager
  target:
    name: {{ .Values.secretName }}
    # The Secret belongs to the ExternalSecret: removed with it on uninstall.
    creationPolicy: Owner
  data:
    {{- range $key, $secretId := .Values.keys }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $secretId | quote }}
        version: latest
    {{- end }}
