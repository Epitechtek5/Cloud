# external-secrets: syncs the runners GitHub App secret from Secret Manager
# (issue #54). Installed by Terraform (infra/foundation/runners_secrets.tf),
# which also sets scopedNamespace to the runners namespace.
#
# Least privilege: the controller only watches the runners namespace, with a
# Role there instead of ClusterRoles, and only runs the SecretStore and
# ExternalSecret reconcilers.
scopedRBAC: true
processClusterStore: false
processClusterExternalSecret: false
processClusterPushSecret: false
processPushSecret: false

# No admission webhook (and so no cert controller): it only validates the
# SecretStore and ExternalSecret that Terraform writes, and would add a
# cluster-wide ValidatingWebhookConfiguration plus a second controller.
webhook:
  create: false
certController:
  create: false

replicaCount: 1
concurrent: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
