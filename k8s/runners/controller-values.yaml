# gha-runner-scale-set-controller: watches the scale sets and creates the
# ephemeral runner pods. Installed once per cluster by Terraform
# (infra/foundation/runners.tf), which also sets the service account name and
# the watched namespace.
replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
