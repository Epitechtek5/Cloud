# The dind sidecar injected by the runner scale set chart has no resources, so
# the scheduler would ignore the load of docker builds and job containers and
# overcommit the node (evicting the ARC controller or listener). Containers that
# declare nothing get these defaults; the runner container sets its own.
apiVersion: v1
kind: LimitRange
metadata:
  name: runners-defaults
  namespace: arc-runners
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 500m
        memory: 1Gi
      default:
        cpu: "2"
        memory: 4Gi
