# gha-runner-scale-set: one pool of ephemeral runners, installed by Terraform
# (infra/foundation/runners.tf). Terraform also sets the per-environment values:
# the scale set name (the label to put in `runs-on` / CI_RUNNER), the GitHub App
# secret name, the controller service account and minRunners / maxRunners
# (runners_min_runners / runners_max_runners in the tfvars).
githubConfigUrl: https://github.com/Epitechtek5/Cloud

# One job per pod: the pod is deleted when the job ends, so no state or
# credentials are shared between jobs. The fleet is bounded by maxRunners
# and by the node pool ceiling (runners_max_nodes). A runner pod requests 1.5 CPU
# and 3Gi (runner + dind, see the LimitRange in runners.tf): an e2-standard-4
# fits about 2, so 3 nodes hold 4 runners with room for the system pods.

# The chart injects the dind sidecar (docker builds and job containers) without
# resources: the LimitRange of the runners namespace gives it defaults.
containerMode:
  type: dind

template:
  spec:
    containers:
      - name: runner
        # Pinned tag: bump it on purpose (the runner auto-updates are refused by ARC).
        image: ghcr.io/actions/actions-runner:2.338.2
        command: ["/home/runner/run.sh"]
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            cpu: "2"
            memory: 4Gi
    nodeSelector:
      purpose: ci-runners
